<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Life World — Mobile Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#cde6f4;color:#2d3446;touch-action:manipulation}
#game{width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#ffffffed;border:1px solid #efd5a8;border-radius:13px;padding:8px 11px;box-shadow:0 3px 10px #33445520;font-size:12px;pointer-events:auto}
.brand{font-weight:900;color:#b93635;font-size:14px}
.bottom{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;background:#c7463d;color:white;padding:10px 12px;font-size:13px;font-weight:750;box-shadow:0 2px 0 #96342e;touch-action:manipulation}
button.alt{background:#4c789e;box-shadow:0 2px 0 #315675}
button:active{transform:translateY(1px)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fffdf1ed;padding:9px 13px;border-radius:12px;font-size:13px;max-width:90%;text-align:center;box-shadow:0 2px 8px #33445520}
@media(min-width:800px){.panel{font-size:14px}.brand{font-size:18px}button{font-size:15px;padding:12px 16px}}
</style></head><body>
<canvas id="game"></canvas>
<div class="top"><div class="panel"><div class="brand">🏮 Little Life World</div><div>Mobile 3D • Chinese Malaysian Home</div></div><div class="panel">👦 Big Bro · 👶 Little Bro<br>🐈 Mimi · 🐹 Dòu Dòu</div></div>
<div class="toast" id="toast">Drag to rotate • pinch to zoom • tap a character or pet</div>
<div class="bottom">
<button onclick="choose('big')">Big Bro</button><button onclick="choose('little')">Little Bro</button>
<button class="alt" onclick="doAction('walk')">🚶 Walk</button><button class="alt" onclick="doAction('sit')">🛋 Sit</button>
<button class="alt" onclick="doAction('eat')">🍚 Eat</button><button class="alt" onclick="doAction('tv')">📺 TV</button>
<button class="alt" onclick="doAction('cat')">🐈 Mimi</button><button class="alt" onclick="doAction('ham')">🐹 Dòu Dòu</button>
<button class="alt" onclick="doAction('fan')">🌀 Fan</button><button class="alt" onclick="doAction('reset')">↺ View</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const canvas=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color('#cce6f5');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(10,9,13);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const controls=new OrbitControls(camera,canvas);controls.target.set(0,1,0);controls.enableDamping=true;controls.rotateSpeed=.7;controls.zoomSpeed=.8;
scene.add(new THREE.HemisphereLight(0xffffff,0x92765b,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,12,7);sun.castShadow=true;scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const wood=M('#b98250'),cream=M('#f4e5cc'),red=M('#c83b35'),blue=M('#7da9d5'),dark=M('#483a35'),skin=M('#efbd91'),hair=M('#30251f');
function box(x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(x,y,z,r,h,m){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);scene.add(o);return o}
box(0,-.15,0,12,.3,10,M('#d9b98d'));box(0,2,-5,12,4,.2,cream);box(-6,2,0,.2,4,10,cream);box(6,2,0,.2,4,10,cream);box(0,2,5,12,4,.2,cream);
box(-3,2.4,-4.86,2,1.4,.08,blue);box(-3,2.4,-4.8,.1,1.5,.1,wood);box(0,2.4,-4.8,.1,1.5,.1,wood);
box(-3,.6,1,3,.6,1.2,blue);box(-3,1.1,.45,3,.5,.3,blue);box(-3,.4,-1.2,2,.12,1,wood);box(-3,1.5,-3.8,2.2,1.2,.1,dark);box(-3,1.5,-3.73,2,.95,.03,M('#29445c'));
box(2,.8,-1,2.2,.15,1.4,wood);for(let x of [1.2,2.8])for(let z of [-1.8,-.2])box(x,.4,z,.4,.6,.4,red);
box(4.5,1,-3.4,2.2,1.2,.8,wood);box(4.5,1.65,-3.4,2.3,.12,.9,cream);box(4.8,1.9,-3.4,.5,.3,.5,dark);box(4.7,.6,-4.5,1.5,1.1,.5,wood);box(4.7,1.5,-4.48,1.1,.6,.08,red);
box(-4,.3,-2.8,2.3,.3,1.5,wood);box(-4,.6,-2.8,2.1,.2,1.35,cream);box(-4,.8,-3.3,.6,.2,.5,blue);
let fan=new THREE.Group();fan.position.set(0,3.7,0);scene.add(fan);cyl(0,3.9,0,.08,.3,dark);for(let i=0;i<4;i++){let b=box(0,0,0,1.4,.06,.24,wood);b.position.x=.75;b.rotation.y=i*Math.PI/2;fan.add(b)}
cyl(0,3.1,-4.5,.24,.45,red);
function human(x,z,shirt,sc){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let torso=new THREE.Mesh(new THREE.CylinderGeometry(.24*sc,.3*sc,.7*sc,12),M(shirt));torso.position.y=1.02*sc;g.add(torso);let h=new THREE.Mesh(new THREE.SphereGeometry(.24*sc,16,12),skin);h.position.y=1.58*sc;g.add(h);let cap=new THREE.Mesh(new THREE.SphereGeometry(.25*sc,16,8,0,Math.PI*2,0,Math.PI/2),hair);cap.position.y=1.66*sc;g.add(cap);for(let s of [-1,1]){let a=new THREE.Mesh(new THREE.CylinderGeometry(.065*sc,.08*sc,.5*sc,8),skin);a.position.set(s*.3*sc,1.02*sc,0);a.rotation.z=s*.25;g.add(a);let l=new THREE.Mesh(new THREE.CylinderGeometry(.08*sc,.1*sc,.5*sc,8),M('#425b83'));l.position.set(s*.12*sc,.3*sc,0);g.add(l)}return g}
const big=human(-1.3,2.5,'#2582cf',1),little=human(.3,2.7,'#efa42c',.78);
function pet(x,z,col){let g=new THREE.Group();g.position.set(x,.15,z);scene.add(g);let b=new THREE.Mesh(new THREE.SphereGeometry(.26,14,10),M(col));b.scale.set(1.3,.8,1);g.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),M(col));h.position.x=.25;h.position.y=.1;g.add(h);return g}
const cat=pet(-2,3.5,'#cfc2b2'),ham=pet(2.5,1.2,'#c98d4b');let selected=big,fanOn=true;
function toast(t){document.getElementById('toast').textContent=t}
function choose(k){selected=k==='big'?big:little;toast((k==='big'?'Big Bro':'Little Bro')+' selected!')}
function doAction(a){if(a==='reset'){camera.position.set(10,9,13);controls.target.set(0,1,0);toast('Camera reset');return}
if(a==='cat'){cat.position.x+=.25;toast('Mimi purrs! 🐈');return}if(a==='ham'){ham.position.z-=.2;toast('Dòu Dòu scurries around! 🐹');return}
if(a==='fan'){fanOn=!fanOn;toast('Ceiling fan '+(fanOn?'ON':'OFF'));return}
if(a==='walk'){selected.position.x+=.5;toast('Your character walked a little!');return}
if(a==='sit'){selected.position.y=-.2;toast('Sit action (starter animation)');return}
toast(a==='eat'?'Yum! Family meal time 🍚':'Watching TV together 📺')}
window.choose=choose;window.doAction=doAction;
let ray=new THREE.Raycaster(),mouse=new THREE.Vector2();canvas.addEventListener('pointerup',e=>{if(e.target!==canvas)return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects([big,little,cat,ham],true);if(hits.length){let o=hits[0].object;while(o.parent&&!([big,little,cat,ham].includes(o)))o=o.parent;if(o===big)choose('big');else if(o===little)choose('little');else if(o===cat)doAction('cat');else if(o===ham)doAction('ham')}});
function loop(){requestAnimationFrame(loop);if(fanOn)fan.rotation.y+=.025;controls.update();renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
